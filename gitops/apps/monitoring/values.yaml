# Trimmed for a single t3.medium system node — no Alertmanager (nothing to
# notify yet), short retention, small resource requests so it fits next to
# Argo CD without needing a bigger node group.

alertmanager:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 3d
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 512Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

grafana:
  image:
    tag: 11.6.1
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 256Mi
  persistence:
    enabled: false
  adminPassword: admin # change after first login; port-forward-only access for now

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
