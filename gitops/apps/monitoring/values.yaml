# Trimmed for a single t3.medium system node — no Alertmanager (nothing to
# notify yet), short retention, small resource requests so it fits next to
# Argo CD without needing a bigger node group.

alertmanager:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 3d
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

grafana:
  image:
    tag: 11.6.1
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 256Mi
  persistence:
    enabled: false
  adminPassword: admin # change after first login; port-forward-only access for now

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
  # kube_node_labels only exposes a small default allowlist of node labels
  # (cardinality safety) - the custom `role: gpu`/`role: system` label set on
  # each node (infraestructure/eks/main.tf) isn't in it by default, so it has
  # to be explicitly opted in here to be queryable as label_role in PromQL.
  extraArgs:
    - --metric-labels-allowlist=nodes=[role]

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
