apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # ${ACME_EMAIL} substituted at apply time (see add-cluster-issuer in the
    # Makefile) so no personal email is committed to git.
    email: ${ACME_EMAIL}
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            # ${ACME_EMAIL} substituted at apply time, same as above.
            email: ${ACME_EMAIL}
            apiTokenSecretRef:
              # NOT committed to git. Create it yourself, once, with:
              #   kubectl create secret generic cloudflare-api-token-secret \
              #     -n cert-manager \
              #     --from-literal=api-token=<your Cloudflare API token>
              # Token needs Zone:DNS:Edit permission scoped to the
              # quezadasubiabre.com zone.
              name: cloudflare-api-token-secret
              key: api-token
        # restricts this solver to the one zone/host in use, so a future
        # ClusterIssuer/solver for another domain doesn't clash.
        selector:
          dnsZones:
            - "quezadasubiabre.com"
