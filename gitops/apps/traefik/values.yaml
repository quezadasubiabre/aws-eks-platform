service:
  # LoadBalancer: the AWS Load Balancer Controller provisions an NLB straight
  # from this Service (annotations below), replacing the ALB+Ingress setup.
  # NOTE: chart v41.x moved this key from `service.type` to `service.spec.type`.
  spec:
    type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    # set via `make update-my-ip` (see Makefile) - not committed with a real IP
    service.beta.kubernetes.io/aws-load-balancer-source-ranges: <YOUR_IP>/32

ports:
  web:
    # redirect plain HTTP straight to HTTPS at the entrypoint level.
    # NOTE: chart v41.x moved this from `ports.web.redirectTo` to
    # `ports.web.http.redirections.entryPoint`.
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    expose:
      default: true

ingressClass:
  enabled: true
  isDefaultClass: true

# Traefik exposes Prometheus metrics (traefik_service_requests_total,
# traefik_service_request_duration_seconds, etc.) on port 9100 by default,
# but that port isn't reachable outside the pod until it's wired to a
# ServiceMonitor. additionalLabels.release: monitoring is required — same
# reasoning as dcgm-exporter's ServiceMonitor (see
# gitops/apps/nvidia-gpu/dcgm-exporter-values.yaml): the Prometheus CR only
# watches ServiceMonitors labeled release: monitoring, so without this label
# Traefik's metrics would be exposed but never actually scraped.
metrics:
  prometheus:
    entryPoint: metrics
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
