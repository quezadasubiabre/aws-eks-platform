apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 65.5.1
      helm:
        valueFiles:
          - $values/gitops/apps/monitoring/values.yaml
    - repoURL: https://github.com/quezadasubiabre/aws-eks-platform.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/quezadasubiabre/aws-eks-platform.git
      targetRevision: main
      path: gitops/apps/monitoring/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # kube-prometheus-stack's CRDs (Prometheus, Alertmanager, etc.) exceed
      # the 262144-byte kubectl.kubernetes.io/last-applied-configuration
      # annotation limit that client-side apply writes; server-side apply
      # doesn't use that annotation, avoiding the "Too long" CRD errors.
      - ServerSideApply=true
