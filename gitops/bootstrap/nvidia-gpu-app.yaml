apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nvidia-gpu
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://nvidia.github.io/k8s-device-plugin
      chart: nvidia-device-plugin
      targetRevision: 0.19.3
      helm:
        valueFiles:
          - $values/gitops/apps/nvidia-gpu/device-plugin-values.yaml
    - repoURL: https://nvidia.github.io/dcgm-exporter/helm-charts
      chart: dcgm-exporter
      targetRevision: 4.8.3
      helm:
        valueFiles:
          - $values/gitops/apps/nvidia-gpu/dcgm-exporter-values.yaml
    - repoURL: https://github.com/quezadasubiabre/aws-eks-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: nvidia-gpu
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
